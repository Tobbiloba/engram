app:
  name: Test Application
  environment: development

features:
  authentication: true
  rate_limiting: true
  caching: false

rate_limits:
  requests_per_minute: 60
  burst_size: 10

cors:
  allowed_origins:
    - http://localhost:3000
    - https://example.com
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
  allowed_headers:
    - Content-Type
    - Authorization
